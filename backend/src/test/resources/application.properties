app.jwt.secret=${JWT_SECRET:diretoriaPecuariaChaveSecretaSuperSegura2026}
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

agrodoc.api.url=https://agrodocai.com.br/api/v1
agrodoc.api.uf=PR
